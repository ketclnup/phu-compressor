name: Build Windows VST3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: cmake --preset vs2026-x64

      - name: Build Release
        run: cmake --build --preset release

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: PHU-Compressor-Windows-VST3
          path: build/vs2026-x64/src/phu-compressor_artefacts/Release/VST3/
